<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Brain trace</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161c26; --border: #2a3344; --text: #e8edf5; --muted: #8b98ad;
    --ok: #3dd68c; --warn: #f0c14a; --bad: #ff6b6b; --blue: #5b9cff; --heard: #6fd3e8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); background: #121722; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  .pill { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.on b { color: var(--ok); } .pill.off b { color: var(--bad); }
  .spacer { flex: 1; }
  button { background: #222a38; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button.stop { background: #5a1d1d; border-color: var(--bad); font-weight: 700; padding: 6px 18px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; padding: 12px; min-height: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .feed { overflow-y: auto; padding: 8px 14px; flex: 1; }
  .row { padding: 6px 0; border-bottom: 1px solid #1f2735; display: grid; grid-template-columns: 64px 70px minmax(0,1fr); gap: 8px; align-items: start; }
  .t { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 2px; }
  .body { overflow-wrap: anywhere; }
  .heard .body { color: var(--heard); font-size: 15px; }
  .say .body { color: var(--ok); font-size: 15px; }
  .clamped .k, .clamped .body { color: var(--warn); }
  .blocked .k, .blocked .body, .estop .k, .estop .body, .error .k, .error .body { color: var(--bad); }
  .estop .body { font-weight: 700; }
  .reasons { font-size: 12px; margin-top: 2px; }
  pre { margin: 0; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: #c9d4e5; }
  .tool { font-family: ui-monospace, monospace; font-size: 12px; }
  #gemma { padding: 12px 14px; overflow: auto; flex: 0 0 auto; max-height: 40%; border-bottom: 1px solid var(--border); }
  #vision { max-width: 100%; border-radius: 6px; margin-top: 8px; display: none; }
  form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  #models { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); background: #111620; font-size: 13px; }
  #models .m { border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px 4px 10px; display: flex; gap: 6px; align-items: center; }
  #models .m.chat { border-color: var(--blue); }
  #models .m .gpu { font-size: 11px; color: var(--muted); }
  #models .m .gpu.full { color: var(--ok); } #models .m .gpu.part { color: var(--warn); }
  #models button { padding: 3px 8px; font-size: 12px; }
  #models .busy { color: var(--warn); }
  button.on { border-color: var(--ok); color: var(--ok); } button.off { border-color: var(--bad); color: var(--bad); }
  input[type=text] { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: inherit; }
</style>
</head>
<body>
<header>
  <h1>🦆 Duck Brain</h1>
  <span class="pill" id="p-model">model <b>–</b></span>
  <span class="pill" id="p-brain">brain <b>–</b></span>
  <span class="pill" id="p-link">robot <b>–</b></span>
  <span class="pill" id="p-expr">eyes <b>–</b></span>
  <span class="pill" id="p-face">face <b>–</b></span>
  <span class="pill" id="p-listen">listening <b>–</b></span>
  <span class="pill" id="p-speak">speaking <b>–</b></span>
  <span class="spacer"></span>
  <button id="brain-btn" title="Off: the duck ignores speech and faces (stop words still work)">brain …</button>
  <label class="pill"><input type="checkbox" id="track"> tracking</label>
  <button class="stop" id="stop">STOP</button>
</header>
<div id="models"><span class="muted">models: loading…</span></div>
<main>
  <section>
    <h2>Conversation &amp; actions</h2>
    <div class="feed" id="feed"></div>
    <form id="say-form">
      <input type="text" id="say" placeholder="Type to the duck (same path as speech)…" autocomplete="off">
      <button type="submit">send</button>
    </form>
  </section>
  <section>
    <h2>Gemma's last decision (raw JSON)</h2>
    <div id="gemma"><pre id="gemma-json">waiting…</pre><img id="vision" alt="what the duck saw"></div>
    <h2>Safety layer: blocked / clamped</h2>
    <div class="feed" id="safety"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmtTime = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour12: false });
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function pill(id, value, good) {
  const el = $(id);
  el.querySelector("b").textContent = value;
  el.classList.toggle("on", good === true);
  el.classList.toggle("off", good === false);
}

function renderState(s) {
  pill("p-model", s.model ?? "–");
  pill("p-brain", s.brain ?? "–", true);
  pill("p-link", s.link ?? "offline", s.link && s.link !== "offline");
  pill("p-expr", s.expression ?? "–");
  pill("p-face", s.face ? "yes" : "no", !!s.face);
  pill("p-listen", s.listening ? "yes" : "no", s.listening ? true : undefined);
  pill("p-speak", s.speaking ? "yes" : "no", s.speaking ? true : undefined);
  $("track").checked = !!s.tracking;
  const on = s.brain !== "paused";
  $("brain-btn").textContent = on ? "brain ON" : "brain OFF";
  $("brain-btn").className = on ? "on" : "off";
}

function describe(e) {
  switch (e.kind) {
    case "heard": return [`${esc(e.text)}`, ` <span class="reasons">via ${esc(e.source)}</span>`];
    case "say": return [`“${esc(e.text)}”`];
    case "gemma": return [`decided in ${e.seconds}s${e.vision ? " (with camera image)" : ""}`];
    case "tool": return [`<span class="tool">${esc(e.tool)} ${esc(JSON.stringify(e.args ?? {}))}${e.ms != null ? ` · ${e.ms}ms` : ""}</span>`,
                         e.reasons?.length ? `<div class="reasons">${e.reasons.map(esc).join("<br>")}</div>` : ""];
    case "safety": return [`${esc(e.action ?? "")} ${e.args ? esc(JSON.stringify(e.args)) : ""} ${esc(e.detail ?? "")}`,
                           e.reasons?.length ? `<div class="reasons">${e.reasons.map(esc).join("<br>")}</div>` : ""];
    case "turn": return [`turn ${e.turn} done in ${e.seconds}s`];
    default: return [esc(e.detail ?? JSON.stringify(e))];
  }
}

function addEvent(e) {
  if (e.kind === "gemma") {
    try { $("gemma-json").textContent = JSON.stringify(JSON.parse(e.raw), null, 2); }
    catch { $("gemma-json").textContent = e.raw; }
    if (!e.vision) $("vision").style.display = "none";
  }
  if (e.kind === "vision" && e.image_b64) {
    $("vision").src = "data:image/jpeg;base64," + e.image_b64;
    $("vision").style.display = "block";
  }
  const row = document.createElement("div");
  row.className = `row ${e.kind} ${e.status ?? ""}`;
  const label = e.status && e.status !== "ok" ? e.status : e.kind;
  row.innerHTML = `<span class="t">${fmtTime(e.ts)}</span><span class="k">${esc(label)}</span><span class="body">${describe(e).join("")}</span>`;
  const feed = $("feed");
  const stick = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 30;
  feed.appendChild(row);
  while (feed.children.length > 400) feed.firstChild.remove();
  if (stick) feed.scrollTop = feed.scrollHeight;
  if (["clamped", "blocked", "estop"].includes(e.status)) {
    const s = row.cloneNode(true);
    $("safety").prepend(s);
  }
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "init") { $("feed").innerHTML = ""; $("safety").innerHTML = ""; msg.events.forEach(addEvent); renderState(msg.state); }
    else if (msg.type === "event") addEvent(msg.event);
    else if (msg.type === "state") renderState(msg.state);
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();

$("say-form").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("say").value.trim();
  if (!text) return;
  $("say").value = "";
  await fetch("/api/say", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
};
$("stop").onclick = () => fetch("/api/estop", { method: "POST" });
$("brain-btn").onclick = () => fetch("/api/brain", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ enabled: $("brain-btn").textContent.includes("OFF") }) });

// ---- models: which are loaded, how much is on the GPU, load / unload / use
let modelsBusy = "";
async function modelCall(path, model, label) {
  modelsBusy = `${label} ${model ?? "all"}…`;
  renderModels(lastModels);
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model }) });
    if (r.ok) lastModels = await r.json();
  } finally { modelsBusy = ""; renderModels(lastModels); }
}
let lastModels = null;
function renderModels(st) {
  const box = $("models");
  if (!st) { box.innerHTML = `<span class="pill">models: Ollama not answering</span>`; return; }
  const loaded = Object.fromEntries(st.loaded.map((m) => [m.name, m]));
  const names = st.available.filter((n) => /gemma/i.test(n) || loaded[n]);
  box.innerHTML = `<span class="pill">chat <b>${esc(st.chat_model)}</b></span><span class="pill">vision <b>${esc(st.vision_model)}</b></span>` +
    (st.single_model ? `<span class="pill" title="other models are unloaded so the active one gets the whole GPU">one at a time</span>` : "") +
    names.map((n) => {
      const m = loaded[n];
      const gpu = m ? `<span class="gpu ${m.gpu_pct >= 99 ? "full" : "part"}">${m.gpu_pct}% GPU · ${m.size_gb} GB</span>` : `<span class="gpu">not loaded</span>`;
      return `<span class="m ${n === st.chat_model ? "chat" : ""}"><b>${esc(n)}</b> ${gpu}` +
        (n !== st.chat_model ? `<button data-use="${esc(n)}">use for chat</button>` : "") +
        (m ? `<button data-unload="${esc(n)}">unload</button>` : `<button data-load="${esc(n)}">load</button>`) + `</span>`;
    }).join("") +
    `<button data-unload-all>unload all</button>` + (modelsBusy ? ` <span class="busy">${esc(modelsBusy)}</span>` : "");
  box.querySelectorAll("[data-use]").forEach((b) => b.onclick = () => modelCall("/api/models/use", b.dataset.use, "switching to"));
  box.querySelectorAll("[data-load]").forEach((b) => b.onclick = () => modelCall("/api/models/load", b.dataset.load, "loading"));
  box.querySelectorAll("[data-unload]").forEach((b) => b.onclick = () => modelCall("/api/models/unload", b.dataset.unload, "unloading"));
  box.querySelectorAll("[data-unload-all]").forEach((b) => b.onclick = () => modelCall("/api/models/unload", null, "unloading"));
}
async function pollModels() {
  if (!modelsBusy) {
    try { const r = await fetch("/api/models"); lastModels = r.ok ? await r.json() : null; } catch { lastModels = null; }
    renderModels(lastModels);
  }
  setTimeout(pollModels, 3000);
}
pollModels();
$("track").onchange = (e) => fetch("/api/tracking", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: e.target.checked }) });
</script>
</body>
</html>
