# Duck Brain configuration (laptop side).

robot:
  # Candidate DCS (Pi 4) addresses; the first that answers /api/health wins and the
  # list is probed again if it stops answering. LAN/hotspot first, Tailscale second.
  urls:
    - http://127.0.0.1:8000          # local testing against a mock DCS
    - http://rpi1.home:8000          # Pi 4 via the home router DNS
    - http://rpi1.local:8000         # Pi 4 on the same hotspot / LAN (mDNS)
    - http://rpi1:8000               # Tailscale MagicDNS name

llm:
  ollama_url: http://127.0.0.1:11434
  model: gemma3:4b                   # open-weight, vision capable
  vision_model: gemma3:4b            # used for camera questions (launch --fast sets model: gemma3:1b, text only)
  num_ctx: 4096
  num_predict: 160                   # keeps replies to 1-2 sentences
  temperature: 0.7
  keep_alive: 2h
  single_model: true                 # keep one model loaded so it gets the whole GPU (needed on 4 GB cards)
  history_turns: 6

speech_in:
  # robot: utterances from the duck's USB mic over /ws/audio (normal demo setup)
  # local: this laptop's microphone (needs the local-mic extra)
  # text:  only the trace UI text box
  source: robot
  stt_model: small.en                # faster-whisper model
  stt_device: cpu                    # ZBook: the 4 GB P1000 is kept for Gemma; CPU STT ~1.6 s per sentence
  stt_compute_type: int8

safety:
  stop_words: ["stop", "duck stop", "freeze", "emergency"]
  max_gestures_per_turn: 3
  max_times: 3
  max_hold_s: 10
  max_say_chars: 300
  # Fallback head limits (degrees) if the robot can't be asked; the robot's own
  # limits from /api/head/state take priority.
  head_limits:
    head_yaw: [-60, 60]
    head_pitch: [-60, 45]
    head_roll: [-20, 20]

vision:
  stream: head_cam
  # Questions that make the brain look through the camera before answering.
  trigger_words: ["see", "look", "holding", "hold", "this", "what is", "wearing", "show", "colour", "color", "who am i", "in front"]

head:
  breathing: true                    # gentle breathing/sway idle motion while the brain runs
  ear_twitch: false                  # occasional ear flicks while breathing (ear servos on the head Pi Zero)

tracking:
  enabled: true
  rate_hz: 12
  horizontal_fov_deg: 54             # OV5647 (Pi camera v1) ~54, v2 ~62, v3 ~66
  vertical_fov_deg: 41
  gain: 0.7                          # how far toward the face each update aims (1 = all the way)
  smoothing: 0.35                     # 0 = raw detections, closer to 1 = calmer but slower
  deadband: 0.06                     # face this close to centre: hold (breathing continues)
  yaw_sign: -1                       # flip if the head turns away from faces
  pitch_sign: 1
  eyes_x_sign: 1                     # flip if the eyes look away from faces
  min_step_deg: 0.4                  # skip updates smaller than this
  greet_on_face: true
  reactions: true                    # starstruck on a new face, cross-eyed when very close, look around when you leave, winks
  close_face_size: 0.45              # face width / image width that counts as "very close"
  lost_after_s: 1.2                  # missed detections shorter than this don't count as leaving
  head_rate_hz: 8                    # head commands per second (DCS allows 10)
  min_confidence: 0.7                # YuNet face score threshold
  greet_after_absent_s: 20
  center_after_lost_s: 8

memory:
  path: memory.json
  max_items: 30

ui:
  host: 127.0.0.1
  port: 8300
