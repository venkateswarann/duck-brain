[project]
name = "duck-brain"
version = "0.1.0"
description = "Offline Gemma brain for an Open Duck Mini desk companion (runs on the laptop, drives DCS over MCP)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.12,<2",
    "websockets>=12",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",  # 5.x dropped the bundled Haar cascades
    "segno>=1.6",  # QR code for the game's join link
]

[project.optional-dependencies]
# Speech-to-text on the laptop (utterances come from the robot's USB mic).
stt = ["faster-whisper>=1.0"]
# NVIDIA GPU speech-to-text (CTranslate2 needs the CUDA 12 cuBLAS and cuDNN 9 runtime libraries).
stt-gpu = ["faster-whisper>=1.0", "nvidia-cublas-cu12>=12.0,<13", "nvidia-cudnn-cu12>=9.0,<10"]
# Use the laptop's own microphone instead of the robot's (testing without the duck).
local-mic = ["sounddevice>=0.4", "webrtcvad-wheels>=2.0"]

[project.scripts]
duck-brain = "duck_brain.main:main"
duck-game = "duck_brain.game.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duck_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
